[project]
name = "agentic-healthcare"
version = "0.1.0"
description = "Production-grade multi-agent healthcare intelligence platform with streaming GraphRAG, pharmacovigilance knowledge graph, and LangGraph orchestration"
requires-python = ">=3.11,<3.14"
# The root project is the local development environment. It depends on every
# workspace member, so `uv sync` and `uv sync --all-packages` install the same
# packages. Runtime pins for the APIs live in the member pyproject.toml files;
# do not duplicate them here.
dependencies = [
    "agent-core",
    "graphrag-shared",
    "healthcare-rag-api[bedrock]",
    "supply-chain-rag-api",
    # Platform tooling (producers, Flink job tests, ontology scripts)
    "pyyaml>=6.0.2",
    "confluent-kafka>=2.5.3",
    "fastavro>=1.9.5",
    "faker>=25.8.0",
    "boto3>=1.34.0",
]

# Installed by default by `uv sync` / `uv run` (exclude with --no-dev).
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
]

[tool.uv]
managed = true

# Deployable Python packages share one lockfile (uv.lock). Each member builds a
# wheel that is installed into the rag-api container images (see ADR-0011).
[tool.uv.workspace]
members = [
    "packages/agent-core",
    "platform/shared",
    "domains/healthcare/rag-api",
    "domains/supply-chain/rag-api",
]

# Linux (containers/CI) resolves torch from the CPU-only index so images do not
# pull multi-GB CUDA wheels; macOS/Windows use PyPI (already CPU/MPS builds).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
agent-core = { workspace = true }
graphrag-shared = { workspace = true, editable = false }
healthcare-rag-api = { workspace = true }
supply-chain-rag-api = { workspace = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
