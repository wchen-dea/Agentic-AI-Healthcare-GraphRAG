[project]
name = "agentic-ai-graphrag"
version = "0.1.0"
description = "Multi-domain Agentic AI GraphRAG platform"
requires-python = ">=3.11"
dependencies = [
    # Shared across domains for local development/testing
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "neo4j>=5.24.0",
    "qdrant-client>=1.11.3",
    "confluent-kafka>=2.5.3",
    "fastavro>=1.9.5",
    "faker>=25.8.0",
    # RAG API
    "fastapi>=0.115.0",
    "uvicorn>=0.31.1",
    "pydantic>=2.11.7,<3.0.0",
    "mcp>=1.28.0",
    "httpx>=0.27.2",
    "email-validator>=2.2.0",
    "prometheus-client>=0.23.1",
    # Embedding (optional heavy dep)
    "sentence-transformers>=3.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
]

[tool.uv]
managed = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
