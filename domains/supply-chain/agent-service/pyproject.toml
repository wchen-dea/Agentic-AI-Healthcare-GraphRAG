[project]
name = "supply-chain-agent-service"
version = "0.1.0"
description = "Supply-chain agent service: FastAPI + MCP tools + LangGraph orchestration over GraphRAG"
requires-python = ">=3.11,<3.14"
# Exact versions are pinned (with hashes) in the workspace uv.lock.
dependencies = [
    "agent-core[metrics]",
    "fastapi==0.115.0",
    "uvicorn==0.31.1",
    "qdrant-client==1.11.3",
    "neo4j==5.24.0",
    "requests==2.32.3",
    "pydantic>=2.11.7,<3.0.0",
    "mcp==1.28.0",
    "httpx==0.27.2",
    "email-validator>=2.2.0",
    "sentence-transformers==3.0.1",
    # Declared directly so the CPU-only wheel source (workspace root) applies.
    "torch>=2.2",
    "langgraph>=0.4.1,<1.0.0",
    "langchain-core>=0.3.0,<1.0.0",
    "langsmith>=0.3.0,<1.0.0",
    "mlflow>=2.21.0,<3.0.0",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "supply_chain_agent"

[tool.uv.sources]
agent-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
