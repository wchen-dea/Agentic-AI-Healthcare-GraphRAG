[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-event-producer"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "confluent-kafka==2.6.1",
  "faker==25.8.0",
  "requests==2.32.3",
  "fastavro==1.9.5",
]

[tool.setuptools]
py-modules = ["produce_events"]