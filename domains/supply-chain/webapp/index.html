<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supply Chain RAG Console</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>:root { --accent: #2563eb; --accent-hover: #1d4ed8; }</style>
  </head>
  <body>
    <main class="layout">
      <section class="card">
        <h1>Supply Chain RAG Console</h1>
        <p class="subtext">Query the Supply Chain Hybrid GraphRAG API for supplier risk, shipment tracking, quality, and disruption analysis.</p>

        <form id="queryForm" class="form">
          <label>
            API Mode
            <select id="apiMode">
              <option value="rag" selected>RAG REST (/query)</option>
              <option value="mcp">FastMCP Tool (/mcp)</option>
            </select>
          </label>

          <label>
            API Base URL
            <input id="apiBase" type="url" value="http://localhost:8001" required />
          </label>

          <label>
            Entity ID (optional — part, supplier, or facility)
            <input id="entityId" type="text" placeholder="part-00001 or supplier-0001" />
          </label>

          <label>
            Supply Chain Question
            <textarea id="question" rows="4" placeholder="e.g. Which suppliers are single-source for critical parts and in high-risk regions?" required></textarea>
          </label>

          <button id="submitBtn" type="submit">Run Query</button>
        </form>
      </section>

      <section class="card">
        <h2>Answer</h2>
        <pre id="answer" class="answer">No query yet.</pre>
      </section>

      <section class="card">
        <h2>Vector Context</h2>
        <pre id="vectorContext">[]</pre>
      </section>

      <section class="card">
        <h2>Graph Context</h2>
        <pre id="graphContext">[]</pre>
      </section>
    </main>

    <script src="/query-helpers.js"></script>
    <script src="/domain.js"></script>
  </body>
</html>
