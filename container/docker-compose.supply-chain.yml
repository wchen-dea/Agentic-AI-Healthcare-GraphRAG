# Supply Chain domain overlay.
# Usage: docker compose -f container/docker-compose.infra.yml -f container/docker-compose.supply-chain.yml up -d

services:
  neo4j-sc:
    image: neo4j:5.26.2
    container_name: supplychain-neo4j
    environment:
      NEO4J_AUTH: neo4j/supplychain123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - neo4j_sc_data:/data

  neo4j-sc-init:
    image: neo4j:5.26.2
    container_name: supplychain-neo4j-init
    depends_on:
      - neo4j-sc
    entrypoint: ["/bin/sh", "-c"]
    command: /bin/sh /bootstrap.sh
    volumes:
      - ../platform/supply-chain/neo4j/init.cypher:/init.cypher
      - ../platform/supply-chain/neo4j/generated_ontology_seeds.cypher:/generated_ontology_seeds.cypher
      - ../platform/supply-chain/neo4j/bootstrap.sh:/bootstrap.sh

  qdrant-sc:
    image: qdrant/qdrant:latest
    container_name: supplychain-qdrant
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - qdrant_sc_data:/qdrant/storage

  sc-kafka-init:
    image: confluentinc/cp-kafka:7.9.0
    container_name: supplychain-kafka-init
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Waiting for Kafka cluster...'
      sleep 30
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic supplychain.purchase.orders --partitions 3 --replication-factor 3
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic supplychain.shipment.updates --partitions 3 --replication-factor 3
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic supplychain.quality.results --partitions 3 --replication-factor 3
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic supplychain.disruption.alerts --partitions 3 --replication-factor 3
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic supplychain.inventory.levels --partitions 3 --replication-factor 3
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic supplychain.master.suppliers --partitions 1 --replication-factor 3
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic supplychain.master.parts --partitions 1 --replication-factor 3
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic supplychain.master.facilities --partitions 1 --replication-factor 3
      echo 'Supply-chain Kafka topics created.'
      "

  sc-producer:
    build:
      context: ..
      dockerfile: platform/supply-chain/producer/Dockerfile
    container_name: supplychain-producer
    depends_on:
      sc-kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092,kafka2:29093,kafka3:29094
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      EVENT_INTERVAL_SECONDS: "1"
      TRANSACTION_EVENTS_PER_INTERVAL: "3"
      REFERENCE_EVENTS_PER_INTERVAL: "2"
    volumes:
      - ../platform/supply-chain/schemas:/app/schemas

  sc-webapp:
    build:
      context: ..
      dockerfile: domains/supply-chain/webapp/Dockerfile
    container_name: supplychain-webapp
    depends_on:
      - sc-rag-api
    ports:
      - "8089:80"

  sc-rag-api:
    build:
      context: ..
      dockerfile: domains/supply-chain/agents/Dockerfile
    container_name: supplychain-rag-api
    depends_on:
      - qdrant-sc
      - neo4j-sc
    ports:
      - "8001:8000"
    environment:
      QDRANT_URL: http://qdrant-sc:6333
      QDRANT_COLLECTION: supplychain_events
      NEO4J_URI: bolt://neo4j-sc:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: supplychain123
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      SC_SKILLS_LAYER_PATH: config/skills_layer.json

  sc-flink-jobmanager:
    build:
      context: ..
      dockerfile: platform/supply-chain/flink-app/Dockerfile
    container_name: supplychain-flink-jobmanager
    ports:
      - "8083:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: sc-flink-jobmanager
        parallelism.default: 2
        state.backend: hashmap
        execution.checkpointing.interval: 10000
        execution.checkpointing.mode: EXACTLY_ONCE
        python.executable: /usr/bin/python3

  sc-flink-taskmanager:
    build:
      context: ..
      dockerfile: platform/supply-chain/flink-app/Dockerfile
    container_name: supplychain-flink-taskmanager
    depends_on:
      - sc-flink-jobmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: sc-flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
        python.executable: /usr/bin/python3

  sc-flink-app:
    build:
      context: ..
      dockerfile: platform/supply-chain/flink-app/Dockerfile
    container_name: supplychain-flink-app
    depends_on:
      sc-flink-jobmanager:
        condition: service_started
      sc-flink-taskmanager:
        condition: service_started
      sc-kafka-init:
        condition: service_completed_successfully
      qdrant-sc:
        condition: service_started
      neo4j-sc:
        condition: service_started
      neo4j-sc-init:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092,kafka2:29093,kafka3:29094
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      QDRANT_URL: http://qdrant-sc:6333
      QDRANT_COLLECTION: supplychain_events
      NEO4J_URI: bolt://neo4j-sc:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: supplychain123
    command: >
      bash -c "sleep 35 && flink run -m sc-flink-jobmanager:8081 -d -Dpython.client.executable=/usr/bin/python3 -Dpython.executable=/usr/bin/python3 -py /app/supplychain_graph_rag_pyflink_job.py && tail -f /dev/null"

  sc-neodash:
    image: neo4jlabs/neodash:latest
    container_name: supplychain-neodash
    platform: linux/amd64
    depends_on:
      - neo4j-sc
    ports:
      - "5006:5005"
    environment:
      standalone: "true"
      standaloneProtocol: neo4j
      standaloneHost: localhost
      standalonePort: "7688"
      standaloneDatabase: neo4j
      standaloneUsername: neo4j
      standalonePassword: supplychain123
      standalonePasswordWarningHidden: "true"
      customHeader: Supply Chain Neo4j GUI

volumes:
  neo4j_sc_data:
  qdrant_sc_data:

networks:
  default:
    name: graphrag-net
    external: true
