name: rag-api-contracts

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/rag-api-contracts.yml
      - pyproject.toml
      - uv.lock
      - packages/**
      - platform/shared/**
      - domains/healthcare/rag-api/**
      - domains/healthcare/skills/**
      - domains/healthcare/scripts/generate_agent_skills.py
      - domains/healthcare/scripts/validate_agent_skills.py
      - domains/supply-chain/rag-api/**
      - domains/supply-chain/skills/**
      - domains/supply-chain/scripts/generate_agent_skills.py
      - domains/supply-chain/scripts/validate_agent_skills.py
      - scripts/lib/**
  pull_request:
    branches:
      - dev
    paths:
      - .github/workflows/rag-api-contracts.yml
      - pyproject.toml
      - uv.lock
      - packages/**
      - platform/shared/**
      - domains/healthcare/rag-api/**
      - domains/healthcare/skills/**
      - domains/healthcare/scripts/generate_agent_skills.py
      - domains/healthcare/scripts/validate_agent_skills.py
      - domains/supply-chain/rag-api/**
      - domains/supply-chain/skills/**
      - domains/supply-chain/scripts/generate_agent_skills.py
      - domains/supply-chain/scripts/validate_agent_skills.py
      - scripts/lib/**

jobs:
  skills-layer-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify generated skill packages are in sync
        run: |
          python domains/healthcare/scripts/generate_agent_skills.py --check
          python domains/supply-chain/scripts/generate_agent_skills.py --check

      - name: Validate Agent Skills packages
        run: |
          python domains/healthcare/scripts/validate_agent_skills.py
          python domains/supply-chain/scripts/validate_agent_skills.py

      - name: Optional upstream skills-ref validation
        shell: bash
        run: |
          run_validation() {
            echo "skills-ref detected; running upstream validation for each skill package"
            for skill_dir in domains/healthcare/skills/* domains/supply-chain/skills/*; do
              if [[ -d "$skill_dir" ]]; then
                skills-ref validate "$skill_dir"
              fi
            done
          }

          if command -v skills-ref >/dev/null 2>&1; then
            run_validation
            exit 0
          fi

          echo "skills-ref binary not found; attempting best-effort install"
          python -m pip install --user skills-ref >/tmp/skills-ref-install.log 2>&1 || true
          export PATH="$HOME/.local/bin:$PATH"

          if command -v skills-ref >/dev/null 2>&1; then
            echo "skills-ref install succeeded"
            run_validation
          else
            echo "skills-ref install failed; skipping optional upstream validation"
            echo "Install log tail:"
            tail -n 20 /tmp/skills-ref-install.log || true
          fi
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.11'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked rag-api environment
        run: uv sync --frozen --package agent-core --package healthcare-rag-api --package supply-chain-rag-api

      - name: Run agent-core tests (policy, audit, guardrails, SSE, settings)
        run: uv run --frozen --package agent-core pytest -q
        working-directory: packages/agent-core

      - name: Run healthcare rag-api tests (contracts, planner, runtime, guardrails)
        run: uv run --frozen --package healthcare-rag-api pytest -q
        working-directory: domains/healthcare/rag-api

      - name: Run supply-chain rag-api tests
        run: uv run --frozen --package supply-chain-rag-api pytest -q
        working-directory: domains/supply-chain/rag-api

      - name: Run evaluation quality gates (offline, from fixtures)
        run: uv run --frozen --package healthcare-rag-api python -m healthcare_rag_api.domain.evaluation_gates --results-file tests/fixtures/evaluation_results.json --min-score 0.5
        working-directory: domains/healthcare/rag-api
        continue-on-error: true

  container-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build healthcare rag-api container
        run: docker build -f domains/healthcare/rag-api/Dockerfile -t rag-api-contracts:ci .

      - name: Build supply-chain rag-api container
        run: docker build -f domains/supply-chain/rag-api/Dockerfile -t sc-rag-api-contracts:ci .

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Lint Helm chart
        run: helm lint deploy/helm

      - name: Template dev values
        run: helm template dev deploy/helm -f deploy/helm/values-dev.yaml > /dev/null

      - name: Template production values
        run: helm template prd deploy/helm -f deploy/helm/values-production.yaml > /dev/null