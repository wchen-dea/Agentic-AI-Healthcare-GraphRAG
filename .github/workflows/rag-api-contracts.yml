name: rag-api-contracts

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/rag-api-contracts.yml
      - domains/healthcare/agents/**
      - domains/healthcare/skills/**
      - domains/healthcare/scripts/generate_agent_skills.py
      - domains/healthcare/scripts/validate_agent_skills.py
      - domains/supply-chain/agents/**
      - domains/supply-chain/skills/**
      - domains/supply-chain/scripts/generate_agent_skills.py
      - domains/supply-chain/scripts/validate_agent_skills.py
      - scripts/lib/**
  pull_request:
    branches:
      - dev
    paths:
      - .github/workflows/rag-api-contracts.yml
      - domains/healthcare/agents/**
      - domains/healthcare/skills/**
      - domains/healthcare/scripts/generate_agent_skills.py
      - domains/healthcare/scripts/validate_agent_skills.py
      - domains/supply-chain/agents/**
      - domains/supply-chain/skills/**
      - domains/supply-chain/scripts/generate_agent_skills.py
      - domains/supply-chain/scripts/validate_agent_skills.py
      - scripts/lib/**

jobs:
  skills-layer-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify generated skill packages are in sync
        run: |
          python domains/healthcare/scripts/generate_agent_skills.py --check
          python domains/supply-chain/scripts/generate_agent_skills.py --check

      - name: Validate Agent Skills packages
        run: |
          python domains/healthcare/scripts/validate_agent_skills.py
          python domains/supply-chain/scripts/validate_agent_skills.py

      - name: Optional upstream skills-ref validation
        shell: bash
        run: |
          run_validation() {
            echo "skills-ref detected; running upstream validation for each skill package"
            for skill_dir in domains/healthcare/skills/* domains/supply-chain/skills/*; do
              if [[ -d "$skill_dir" ]]; then
                skills-ref validate "$skill_dir"
              fi
            done
          }

          if command -v skills-ref >/dev/null 2>&1; then
            run_validation
            exit 0
          fi

          echo "skills-ref binary not found; attempting best-effort install"
          python -m pip install --user skills-ref >/tmp/skills-ref-install.log 2>&1 || true
          export PATH="$HOME/.local/bin:$PATH"

          if command -v skills-ref >/dev/null 2>&1; then
            echo "skills-ref install succeeded"
            run_validation
          else
            echo "skills-ref install failed; skipping optional upstream validation"
            echo "Install log tail:"
            tail -n 20 /tmp/skills-ref-install.log || true
          fi
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: domains/healthcare/agents/requirements.txt

      - name: Create isolated venv
        run: python -m venv .venv311

      - name: Install rag-api dependencies
        run: .venv311/bin/python -m pip install -r domains/healthcare/agents/requirements.txt

      - name: Run rag-api contract tests
        run: .venv311/bin/python domains/healthcare/agents/tests/test_contracts.py

      - name: Run planner evaluation suite
        run: .venv311/bin/python domains/healthcare/agents/tests/test_planner_evaluation.py

      - name: Run planner edge-case suite
        run: .venv311/bin/python domains/healthcare/agents/tests/test_planner_edge_cases.py

      - name: Run evaluation quality gates (offline, from fixtures)
        run: .venv311/bin/python -m domain.evaluation_gates --results-file domains/healthcare/agents/tests/fixtures/evaluation_results.json --min-score 0.5
        working-directory: domains/healthcare/agents
        continue-on-error: true

  container-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build rag-api container
        run: docker build -f domains/healthcare/agents/Dockerfile -t rag-api-contracts:ci .

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Lint Helm chart
        run: helm lint deploy/helm

      - name: Template dev values
        run: helm template dev deploy/helm -f deploy/helm/values-dev.yaml > /dev/null

      - name: Template production values
        run: helm template prd deploy/helm -f deploy/helm/values-production.yaml > /dev/null