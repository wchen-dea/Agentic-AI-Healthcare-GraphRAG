name: ontology-conformance

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/ontology-conformance.yml
      - config/ontology/**
      - flink-app/**
      - neo4j/init.cypher
      - neo4j/generated_ontology_seeds.cypher
      - neo4j/bootstrap.sh
      - scripts/generate_ontology_seed_cypher.py
      - scripts/validate_ontology.py
  pull_request:
    branches:
      - dev
    paths:
      - .github/workflows/ontology-conformance.yml
      - config/ontology/**
      - flink-app/**
      - neo4j/init.cypher
      - neo4j/generated_ontology_seeds.cypher
      - neo4j/bootstrap.sh
      - scripts/generate_ontology_seed_cypher.py
      - scripts/validate_ontology.py

jobs:
  ontology-loader-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: flink-app/requirements.txt

      - name: Install Flink test dependencies
        run: python -m pip install -r flink-app/requirements.txt

      - name: Run ontology loader tests
        run: python -m unittest discover -s flink-app/tests -p 'test_ontology_loader.py'

  runtime-rule-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: flink-app/requirements.txt

      - name: Install Flink test dependencies
        run: python -m pip install -r flink-app/requirements.txt

      - name: Run runtime rule tests
        run: python -m unittest discover -s flink-app/tests -p 'test_runtime_rules.py'

  module-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: flink-app/requirements.txt

      - name: Install Flink test dependencies
        run: python -m pip install -r flink-app/requirements.txt

      - name: Run direct module unit tests
        run: |
          python -m unittest discover -s flink-app/tests -p 'test_storage.py'
          python -m unittest discover -s flink-app/tests -p 'test_graph_writes.py'
          python -m unittest discover -s flink-app/tests -p 'test_pipeline_service.py'

  seed-generation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: flink-app/requirements.txt

      - name: Install Flink test dependencies
        run: python -m pip install -r flink-app/requirements.txt

      - name: Run seed generation tests
        run: python -m unittest discover -s flink-app/tests -p 'test_seed_generation.py' && python scripts/validate_ontology.py

  bootstrap-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Neo4j bootstrap smoke test
        run: python scripts/test_neo4j_bootstrap.py