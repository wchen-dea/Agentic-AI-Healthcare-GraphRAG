name: ontology-conformance

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/ontology-conformance.yml
      - domains/healthcare/knowledge/ontology/**
      - domains/healthcare/data-pipelines/producer/produce_events.py
      - domains/healthcare/data-pipelines/flink-job/**
      - packages/knowledge-core/**
      - domains/healthcare/knowledge/graph-seeds/init.cypher
      - domains/healthcare/knowledge/graph-seeds/generated_ontology_seeds.cypher
      - domains/healthcare/knowledge/graph-seeds/bootstrap.sh
      - domains/healthcare/scripts/generate_ontology_seed_cypher.py
      - domains/healthcare/scripts/validate_ontology.py
      - domains/healthcare/scripts/validate_terminology_coverage.py
      - domains/healthcare/scripts/validate_ontology_drift.py
      - domains/healthcare/scripts/test_neo4j_bootstrap.py
      - domains/supply-chain/knowledge/ontology/**
      - domains/supply-chain/knowledge/graph-seeds/**
      - domains/supply-chain/scripts/validate_ontology.py
      - domains/supply-chain/scripts/test_neo4j_bootstrap.py
      - domains/supply-chain/scripts/generate_ontology_seed_cypher.py
  pull_request:
    branches:
      - dev
    paths:
      - .github/workflows/ontology-conformance.yml
      - domains/healthcare/knowledge/ontology/**
      - domains/healthcare/data-pipelines/producer/produce_events.py
      - domains/healthcare/data-pipelines/flink-job/**
      - packages/knowledge-core/**
      - domains/healthcare/knowledge/graph-seeds/init.cypher
      - domains/healthcare/knowledge/graph-seeds/generated_ontology_seeds.cypher
      - domains/healthcare/knowledge/graph-seeds/bootstrap.sh
      - domains/healthcare/scripts/generate_ontology_seed_cypher.py
      - domains/healthcare/scripts/validate_ontology.py
      - domains/healthcare/scripts/validate_terminology_coverage.py
      - domains/healthcare/scripts/validate_ontology_drift.py
      - domains/healthcare/scripts/test_neo4j_bootstrap.py
      - domains/supply-chain/knowledge/ontology/**
      - domains/supply-chain/knowledge/graph-seeds/**
      - domains/supply-chain/scripts/validate_ontology.py
      - domains/supply-chain/scripts/test_neo4j_bootstrap.py
      - domains/supply-chain/scripts/generate_ontology_seed_cypher.py

jobs:
  ontology-loader-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: domains/healthcare/data-pipelines/flink-job/pyproject.toml

      - name: Install Flink test dependencies
        run: python -m pip install domains/healthcare/data-pipelines/flink-job ./packages/knowledge-core

      - name: Run ontology loader tests
        run: python -m unittest discover -s domains/healthcare/data-pipelines/flink-job/tests -p 'test_ontology_loader.py'

  runtime-rule-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: domains/healthcare/data-pipelines/flink-job/pyproject.toml

      - name: Install Flink test dependencies
        run: python -m pip install domains/healthcare/data-pipelines/flink-job ./packages/knowledge-core

      - name: Run runtime rule tests
        run: python -m unittest discover -s domains/healthcare/data-pipelines/flink-job/tests -p 'test_runtime_rules.py'

  module-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: domains/healthcare/data-pipelines/flink-job/pyproject.toml

      - name: Install Flink test dependencies
        run: python -m pip install domains/healthcare/data-pipelines/flink-job ./packages/knowledge-core

      - name: Run direct module unit tests
        run: |
          python -m unittest discover -s domains/healthcare/data-pipelines/flink-job/tests -p 'test_storage.py'
          python -m unittest discover -s domains/healthcare/data-pipelines/flink-job/tests -p 'test_graph_writes.py'
          python -m unittest discover -s domains/healthcare/data-pipelines/flink-job/tests -p 'test_pipeline_service.py'

  seed-generation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: domains/healthcare/data-pipelines/flink-job/pyproject.toml

      - name: Install Flink test dependencies
        run: python -m pip install domains/healthcare/data-pipelines/flink-job ./packages/knowledge-core

      - name: Run seed generation tests
        run: |
          python -m unittest discover -s domains/healthcare/data-pipelines/flink-job/tests -p 'test_seed_generation.py'
          python domains/healthcare/scripts/validate_ontology.py

  terminology-coverage-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate terminology coverage
        run: python domains/healthcare/scripts/validate_terminology_coverage.py

  ontology-drift-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: domains/healthcare/data-pipelines/flink-job/pyproject.toml

      - name: Install dependencies
        run: python -m pip install domains/healthcare/data-pipelines/flink-job ./packages/knowledge-core

      - name: Validate ontology drift
        run: python domains/healthcare/scripts/validate_ontology_drift.py

  bootstrap-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Neo4j bootstrap smoke test
        run: |
          python domains/healthcare/scripts/test_neo4j_bootstrap.py
          python domains/supply-chain/scripts/test_neo4j_bootstrap.py