name: ontology-conformance

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/ontology-conformance.yml
      - data-platform/healthcare/config/ontology/**
      - data-platform/healthcare/producer/produce_events.py
      - data-platform/healthcare/flink-app/**
      - data-platform/healthcare/neo4j/init.cypher
      - data-platform/healthcare/neo4j/generated_ontology_seeds.cypher
      - data-platform/healthcare/neo4j/bootstrap.sh
      - domains/healthcare/scripts/generate_ontology_seed_cypher.py
      - domains/healthcare/scripts/validate_ontology.py
      - domains/healthcare/scripts/validate_terminology_coverage.py
      - domains/healthcare/scripts/test_neo4j_bootstrap.py
      - data-platform/supply-chain/config/ontology/**
      - data-platform/supply-chain/neo4j/**
      - domains/supply-chain/scripts/validate_ontology.py
      - domains/supply-chain/scripts/test_neo4j_bootstrap.py
      - domains/supply-chain/scripts/generate_ontology_seed_cypher.py
  pull_request:
    branches:
      - dev
    paths:
      - .github/workflows/ontology-conformance.yml
      - data-platform/healthcare/config/ontology/**
      - data-platform/healthcare/producer/produce_events.py
      - data-platform/healthcare/flink-app/**
      - data-platform/healthcare/neo4j/init.cypher
      - data-platform/healthcare/neo4j/generated_ontology_seeds.cypher
      - data-platform/healthcare/neo4j/bootstrap.sh
      - domains/healthcare/scripts/generate_ontology_seed_cypher.py
      - domains/healthcare/scripts/validate_ontology.py
      - domains/healthcare/scripts/validate_terminology_coverage.py
      - domains/healthcare/scripts/test_neo4j_bootstrap.py
      - data-platform/supply-chain/config/ontology/**
      - data-platform/supply-chain/neo4j/**
      - domains/supply-chain/scripts/validate_ontology.py
      - domains/supply-chain/scripts/test_neo4j_bootstrap.py
      - domains/supply-chain/scripts/generate_ontology_seed_cypher.py

jobs:
  ontology-loader-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: data-platform/healthcare/flink-app/requirements.txt

      - name: Install Flink test dependencies
        run: python -m pip install -r data-platform/healthcare/flink-app/requirements.txt

      - name: Run ontology loader tests
        run: python -m unittest discover -s data-platform/healthcare/flink-app/tests -p 'test_ontology_loader.py'

  runtime-rule-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: data-platform/healthcare/flink-app/requirements.txt

      - name: Install Flink test dependencies
        run: python -m pip install -r data-platform/healthcare/flink-app/requirements.txt

      - name: Run runtime rule tests
        run: python -m unittest discover -s data-platform/healthcare/flink-app/tests -p 'test_runtime_rules.py'

  module-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: data-platform/healthcare/flink-app/requirements.txt

      - name: Install Flink test dependencies
        run: python -m pip install -r data-platform/healthcare/flink-app/requirements.txt

      - name: Run direct module unit tests
        run: |
          python -m unittest discover -s data-platform/healthcare/flink-app/tests -p 'test_storage.py'
          python -m unittest discover -s data-platform/healthcare/flink-app/tests -p 'test_graph_writes.py'
          python -m unittest discover -s data-platform/healthcare/flink-app/tests -p 'test_pipeline_service.py'

  seed-generation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: data-platform/healthcare/flink-app/requirements.txt

      - name: Install Flink test dependencies
        run: python -m pip install -r data-platform/healthcare/flink-app/requirements.txt

      - name: Run seed generation tests
        run: |
          python -m unittest discover -s data-platform/healthcare/flink-app/tests -p 'test_seed_generation.py'
          python domains/healthcare/scripts/validate_ontology.py

  terminology-coverage-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate terminology coverage
        run: python domains/healthcare/scripts/validate_terminology_coverage.py

  bootstrap-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Neo4j bootstrap smoke test
        run: |
          python domains/healthcare/scripts/test_neo4j_bootstrap.py
          python domains/supply-chain/scripts/test_neo4j_bootstrap.py