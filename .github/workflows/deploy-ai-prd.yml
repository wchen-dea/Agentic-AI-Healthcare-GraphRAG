name: deploy-ai-prd

on:
  push:
    branches:
      - prd
    paths:
      - .github/workflows/deploy-ai-prd.yml
      - deploy/helm/**
      - domains/healthcare/agents/**
      - domains/healthcare/webapp/**
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-ai-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars['AWS_ROLE_TO_ASSUME'] }}
          aws-region: ${{ vars['AWS_REGION'] }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Configure kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"
        env:
          AWS_REGION: ${{ vars['AWS_REGION'] }}
          EKS_CLUSTER_NAME: ${{ vars['EKS_CLUSTER_NAME'] }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install healthcare deploy/helm \
            -f deploy/helm/values-production.yaml \
            -n healthcare-ai --create-namespace \
            --set rag-api.secrets.NEO4J_PASSWORD="$NEO4J_PASSWORD" \
            --set rag-api.secrets.OPENAI_API_KEY="$OPENAI_API_KEY" \
            --set rag-api.secrets.ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            --wait --timeout 5m
        env:
          NEO4J_PASSWORD: ${{ secrets['NEO4J_PASSWORD'] }}
          OPENAI_API_KEY: ${{ secrets['OPENAI_API_KEY'] }}
          ANTHROPIC_API_KEY: ${{ secrets['ANTHROPIC_API_KEY'] }}

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/rag-api -n healthcare-ai --timeout=300s
          kubectl rollout status deployment/provider-web -n healthcare-ai --timeout=300s

      - name: Show deployment status
        run: |
          kubectl get pods -n healthcare-ai
          kubectl get svc -n healthcare-ai