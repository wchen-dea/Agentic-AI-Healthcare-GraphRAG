name: agent-service-contracts

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/agent-service-contracts.yml
      - pyproject.toml
      - uv.lock
      - packages/**
      - packages/knowledge-core/**
      - domains/healthcare/agent-service/**
      - domains/healthcare/knowledge/skills/**
      - domains/healthcare/scripts/generate_agent_skills.py
      - domains/healthcare/scripts/validate_agent_skills.py
      - domains/supply-chain/agent-service/**
      - domains/supply-chain/knowledge/skills/**
      - domains/supply-chain/scripts/generate_agent_skills.py
      - domains/supply-chain/scripts/validate_agent_skills.py
      - scripts/lib/**
      - domains/*/scripts/**
      - domains/*/data-pipelines/**/*.py
  pull_request:
    branches:
      - dev
    paths:
      - .github/workflows/agent-service-contracts.yml
      - pyproject.toml
      - uv.lock
      - packages/**
      - packages/knowledge-core/**
      - domains/healthcare/agent-service/**
      - domains/healthcare/knowledge/skills/**
      - domains/healthcare/scripts/generate_agent_skills.py
      - domains/healthcare/scripts/validate_agent_skills.py
      - domains/supply-chain/agent-service/**
      - domains/supply-chain/knowledge/skills/**
      - domains/supply-chain/scripts/generate_agent_skills.py
      - domains/supply-chain/scripts/validate_agent_skills.py
      - scripts/lib/**
      - domains/*/scripts/**
      - domains/*/data-pipelines/**/*.py

jobs:
  skills-layer-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify generated skill packages are in sync
        run: |
          python domains/healthcare/scripts/generate_agent_skills.py --check
          python domains/supply-chain/scripts/generate_agent_skills.py --check

      - name: Validate Agent Skills packages
        run: |
          python domains/healthcare/scripts/validate_agent_skills.py
          python domains/supply-chain/scripts/validate_agent_skills.py

      - name: Optional upstream skills-ref validation
        shell: bash
        run: |
          run_validation() {
            echo "skills-ref detected; running upstream validation for each skill package"
            for skill_dir in domains/healthcare/knowledge/skills/* domains/supply-chain/knowledge/skills/*; do
              if [[ -d "$skill_dir" ]]; then
                skills-ref validate "$skill_dir"
              fi
            done
          }

          if command -v skills-ref >/dev/null 2>&1; then
            run_validation
            exit 0
          fi

          echo "skills-ref binary not found; attempting best-effort install"
          python -m pip install --user skills-ref >/tmp/skills-ref-install.log 2>&1 || true
          export PATH="$HOME/.local/bin:$PATH"

          if command -v skills-ref >/dev/null 2>&1; then
            echo "skills-ref install succeeded"
            run_validation
          else
            echo "skills-ref install failed; skipping optional upstream validation"
            echo "Install log tail:"
            tail -n 20 /tmp/skills-ref-install.log || true
          fi
  ruff-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.11'

      # Version matches the ruff pin resolved in uv.lock; config lives in the root pyproject.toml.
      - name: Ruff lint (blocking)
        run: uvx ruff@0.16.3 check --output-format=github packages domains scripts

  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.11'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked agent service environments
        run: uv sync --frozen --package agent-core --package healthcare-agent-service --package supply-chain-agent-service

      - name: Unit tests (agent-core, healthcare, supply-chain)
        run: |
          (cd packages/agent-core && uv run --frozen --package agent-core pytest -q tests/unit)
          (cd domains/healthcare/agent-service && uv run --frozen --package healthcare-agent-service pytest -q tests/unit)
          (cd domains/supply-chain/agent-service && uv run --frozen --package supply-chain-agent-service pytest -q tests/unit)

      - name: Integration tests (HTTP/MCP contracts, tracing, ontology conformance)
        run: |
          (cd domains/healthcare/agent-service && uv run --frozen --package healthcare-agent-service pytest -q tests/integration)
          (cd domains/supply-chain/agent-service && uv run --frozen --package supply-chain-agent-service pytest -q tests/integration)

      - name: Evaluation suites (offline planner and quality fixtures)
        run: uv run --frozen --package healthcare-agent-service pytest -q tests/evals
        working-directory: domains/healthcare/agent-service

      - name: Run evaluation quality gates (offline, from fixtures)
        run: uv run --frozen --package healthcare-agent-service python -m healthcare_agent.evaluation.gates --results-file tests/evals/fixtures/evaluation_results.json --min-score 0.5
        working-directory: domains/healthcare/agent-service
        continue-on-error: true

  container-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build healthcare agent-service container
        run: docker build -f domains/healthcare/agent-service/Dockerfile -t agent-service-contracts:ci .

      - name: Build supply-chain agent-service container
        run: docker build -f domains/supply-chain/agent-service/Dockerfile -t sc-agent-service-contracts:ci .

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Lint Helm chart
        run: helm lint infra/helm

      - name: Template dev values
        run: helm template dev infra/helm -f infra/helm/values-dev.yaml > /dev/null

      - name: Template production values
        run: helm template prd infra/helm -f infra/helm/values-production.yaml > /dev/null