apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: healthcare-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
        component: observability
    spec:
      containers:
      - name: mlflow
        image: ghcr.io/mlflow/mlflow:v2.21.3
        command:
        - mlflow
        - server
        - --host
        - "0.0.0.0"
        - --port
        - "5000"
        - --backend-store-uri
        - sqlite:///mlflow/mlflow.db
        - --default-artifact-root
        - /mlflow/artifacts
        ports:
        - containerPort: 5000
          name: http
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: mlflow-data
          mountPath: /mlflow
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
      volumes:
      - name: mlflow-data
        persistentVolumeClaim:
          claimName: mlflow-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
  namespace: healthcare-ai
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi