apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
  namespace: healthcare-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flink-taskmanager
  template:
    metadata:
      labels:
        app: flink-taskmanager
        component: data-platform
    spec:
      containers:
      - name: taskmanager
        image: ghcr.io/wchen-dea/agentic-ai-healthcare-graphrag-flink-cluster:latest
        imagePullPolicy: IfNotPresent
        command: ["/docker-entrypoint.sh", "taskmanager"]
        env:
        - name: FLINK_PROPERTIES
          value: |
            jobmanager.rpc.address: flink-jobmanager
            taskmanager.numberOfTaskSlots: 4
            parallelism.default: 2
            python.executable: /usr/bin/python3
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"