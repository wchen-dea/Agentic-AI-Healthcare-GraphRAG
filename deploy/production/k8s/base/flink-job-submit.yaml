apiVersion: batch/v1
kind: Job
metadata:
  name: healthcare-flink-job
  namespace: healthcare-ai
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: healthcare-flink-job
        component: data-platform
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-jobmanager
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z flink-jobmanager 8081; do sleep 5; done']
      containers:
      - name: submit
        image: ghcr.io/wchen-dea/agentic-ai-healthcare-graphrag-flink-app:latest
        imagePullPolicy: IfNotPresent
        command:
        - flink
        - run
        - -m
        - flink-jobmanager:8081
        - -d
        - -Dpython.client.executable=/usr/bin/python3
        - -Dpython.executable=/usr/bin/python3
        - -py
        - /app/healthcare_graph_rag_pyflink_job.py
        envFrom:
        - configMapRef:
            name: rag-api-config
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"