apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: healthcare-ai
resources:
- namespace.yaml
# AI agents
- rag-api-configmap.yaml
- rag-api-deployment.yaml
- rag-api-service.yaml
- hpa-rag-api.yaml
# Provider web
- provider-web-deployment.yaml
- provider-web-service.yaml
- hpa-provider-web.yaml
# Data platform — Flink cluster
- flink-jobmanager-deployment.yaml
- flink-jobmanager-service.yaml
- flink-taskmanager-deployment.yaml
- flink-job-submit.yaml
# Observability — MLflow
- mlflow-deployment.yaml
- mlflow-service.yaml
# Network policies
- networkpolicy-default-deny-ingress.yaml
- networkpolicy-rag-api.yaml
- networkpolicy-provider-web.yaml
- networkpolicy-data-platform.yaml
# Apply your generated secret separately:
# kubectl apply -f rag-api-secret.yaml