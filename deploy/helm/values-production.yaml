# Production environment: multi-replica, HPA, external services, NetworkPolicy
networkPolicies:
  enabled: true
rag-api:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
  config:
    QDRANT_URL: "https://qdrant.company.example"
    QDRANT_COLLECTION: "healthcare_events"
    NEO4J_URI: "neo4j+s://neo4j.company.example:7687"
    NEO4J_USER: "neo4j"
    LLM_PROVIDER: "openai"
    LLM_MODEL: "gpt-4.1-mini"
    LLM_FALLBACK_PROVIDER: "anthropic"
    LLM_FALLBACK_MODEL: "claude-sonnet-4-20250514"
    LLM_TIMEOUT_SECONDS: "120"
    LLM_MAX_TOKENS: "1200"
    LLM_TEMPERATURE: "0.2"
    OLLAMA_URL: ""
    OLLAMA_MODEL: ""
    MCP_SERVER_NAME: "HealthcareGraphRAG MCP"
    RAG_API_LANGGRAPH_ENABLED: "false"
    LANGGRAPH_MAX_ITERATIONS: "3"
    MLFLOW_TRACKING_URI: "http://mlflow:5000"
    MLFLOW_EXPERIMENT_NAME: "healthcare-graphrag"
    RAG_API_ALLOW_ROLE_HEADER: "false"
  secrets: {}
  # Inject via external secret manager:
  # NEO4J_PASSWORD: ""
  # OPENAI_API_KEY: ""
  # ANTHROPIC_API_KEY: ""
provider-web:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
flink:
  taskmanager:
    replicas: 2
mlflow:
  persistence:
    enabled: true
    size: 10Gi