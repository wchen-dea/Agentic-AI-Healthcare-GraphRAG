apiVersion: v2
name: healthcare-ai
description: Healthcare AI GraphRAG platform umbrella chart
type: application
version: 0.1.0
appVersion: "1.0.0"
dependencies:
- name: rag-api
  version: 0.1.0
  condition: rag-api.enabled
- name: provider-web
  version: 0.1.0
  condition: provider-web.enabled
- name: flink
  version: 0.1.0
  condition: flink.enabled
- name: mlflow
  version: 0.1.0
  condition: mlflow.enabled
- name: kafka
  version: 0.1.0
  condition: kafka.enabled
- name: neo4j
  version: 0.1.0
  condition: neo4j.enabled
- name: qdrant
  version: 0.1.0
  condition: qdrant.enabled
- name: ollama
  version: 0.1.0
  condition: ollama.enabled
- name: conduktor
  version: 0.1.0
  condition: conduktor.enabled
- name: producer
  version: 0.1.0
  condition: producer.enabled