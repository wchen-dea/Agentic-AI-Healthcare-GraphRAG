{{- if .Values.topicInit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
  labels:
    app: kafka-topic-init
    component: kafka-platform
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-kafka
        image: busybox:1.36
        command: ['sh', '-c', 'echo "Waiting for Kafka..."; sleep 15; until nc -z kafka 29092; do sleep 3; done; echo "Kafka ready"']
      containers:
      - name: topic-init
        image: "{{ .Values.broker.image.repository }}:{{ .Values.broker.image.tag }}"
        command:
        - /bin/sh
        - -c
        - |
          {{- range .Values.topicInit.topics }}
          kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic {{ .name }} --partitions {{ .partitions }} --replication-factor 1
          {{- end }}
          echo "All topics created."
{{- end }}
