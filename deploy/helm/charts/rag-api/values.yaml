enabled: true
replicaCount: 2
image:
  repository: ghcr.io/wchen-dea/agentic-ai-healthcare-graphrag-rag-api
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8000
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
config:
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_COLLECTION: "healthcare_events"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  LLM_PROVIDER: "ollama"
  LLM_MODEL: "llama3.1"
  LLM_TIMEOUT_SECONDS: "180"
  LLM_MAX_TOKENS: "1200"
  LLM_TEMPERATURE: "0.2"
  OLLAMA_URL: "http://ollama:11434"
  OLLAMA_MODEL: "llama3.1"
  MCP_SERVER_NAME: "HealthcareGraphRAG MCP"
  RAG_API_LANGGRAPH_ENABLED: "false"
  LANGGRAPH_MAX_ITERATIONS: "3"
  MLFLOW_TRACKING_URI: "http://mlflow:5000"
  MLFLOW_EXPERIMENT_NAME: "healthcare-graphrag"
  RAG_API_ALLOW_ROLE_HEADER: "false"
secrets: {}
# NEO4J_PASSWORD: ""
# OPENAI_API_KEY: ""

networkPolicy:
  enabled: true