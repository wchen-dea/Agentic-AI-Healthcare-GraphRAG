apiVersion: batch/v1
kind: Job
metadata:
  name: flink-job-submit
  labels:
    {{- include "flink.labels" . | nindent 4 }}
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-jobmanager
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z flink-jobmanager 8081; do sleep 2; done']
      containers:
      - name: submit
        image: "{{ .Values.job.image.repository }}:{{ .Values.job.image.tag }}"
        imagePullPolicy: IfNotPresent
        command:
        - flink
        - run
        - -m
        - flink-jobmanager:8081
        - -py
        - {{ .Values.job.mainClass }}
