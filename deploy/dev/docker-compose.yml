services:
  neo4j:
    image: neo4j:5-community
    container_name: dev-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/healthcare123
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: dev-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: dev-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  rag-api:
    image: ghcr.io/wchen-dea/agentic-ai-healthcare-graphrag-rag-api:latest
    container_name: dev-rag-api
    depends_on:
      - neo4j
      - qdrant
      - ollama
    env_file:
      - ./rag-api.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  provider-web:
    image: ghcr.io/wchen-dea/agentic-ai-healthcare-graphrag-provider-web:latest
    container_name: dev-webapp
    depends_on:
      - rag-api
    ports:
      - "8088:80"
    restart: unless-stopped

volumes:
  neo4j_data:
  qdrant_data:
  ollama_models:
