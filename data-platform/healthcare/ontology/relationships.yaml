version: 0.1.0
status: draft
owner: platform-team
purpose: Allowed canonical relationships for the healthcare ontology.
relationships:
- type: ABOUT_PATIENT
  from: ClinicalEvent
  to: Patient
  cardinality: many_to_one
  required_properties: []
- type: FROM_SOURCE
  from: ClinicalEvent
  to: SourceSystem
  cardinality: many_to_one
  required_properties: []
- type: DURING_ENCOUNTER
  from: ClinicalEvent
  to: Encounter
  cardinality: many_to_one
  required_properties: []
- type: HAS_CONDITION
  from: Patient
  to: Condition
  cardinality: many_to_many
  required_properties: [onset_ts]
- type: HAS_SYMPTOM
  from: Patient
  to: Symptom
  cardinality: many_to_many
  required_properties: []
- type: HAS_OBSERVATION
  from: Patient
  to: Observation
  cardinality: many_to_many
  required_properties: []
- type: MAY_INDICATE
  from: Observation
  to: Condition
  cardinality: many_to_many
  required_properties: [reason]
- type: CODED_AS
  from: Condition
  to: ICD10Code
  cardinality: many_to_many
  required_properties: []
- type: HAS_MEDICATION_ORDER
  from: Patient
  to: MedicationOrder
  cardinality: many_to_many
  required_properties: []
- type: ORDERS_MEDICATION
  from: MedicationOrder
  to: Medication
  cardinality: many_to_one
  required_properties: []
- type: HAS_KNOWN_REACTION
  from: Medication
  to: Symptom
  cardinality: many_to_many
  required_properties: [severity, meddra_term]
- type: CONTRAINDICATED_FOR
  from: Medication
  to: Condition
  cardinality: many_to_many
  required_properties: [reason, severity]
- type: INTERACTS_WITH
  from: Medication
  to: Medication
  cardinality: many_to_many
  required_properties: [risk, severity]
  optional_properties: [mechanism]
- type: REPORTED_ADVERSE_REACTION
  from: Patient
  to: AdverseEvent
  cardinality: many_to_many
  required_properties: []
- type: ASSOCIATED_WITH_MEDICATION
  from: AdverseEvent
  to: Medication
  cardinality: many_to_many
  required_properties: []
- type: TRIGGERED_BY_EVENT
  from: AdverseEvent
  to: ClinicalEvent
  cardinality: many_to_one
  required_properties: []
- type: HAS_DEVICE_READING
  from: Patient
  to: DeviceReading
  cardinality: many_to_many
  required_properties: []
- type: MEASURED_BY
  from: DeviceReading
  to: Device
  cardinality: many_to_one
  required_properties: []
- type: HAS_CLAIM
  from: Patient
  to: Claim
  cardinality: many_to_many
  required_properties: []
- type: FOR_PROCEDURE
  from: Claim
  to: Procedure
  cardinality: many_to_one
  required_properties: []
- type: SUBMITTED_TO
  from: Claim
  to: Payer
  cardinality: many_to_one
  required_properties: []
- type: RESULTED_IN
  from: Claim
  to: AdverseOutcome
  cardinality: many_to_many
  required_properties: []
- type: MANAGED_BY
  from: Patient
  to: Provider
  cardinality: many_to_many
  required_properties: []
- type: SEEN_BY
  from: Encounter
  to: Provider
  cardinality: many_to_many
  required_properties: []
- type: REGISTERED_DEVICE
  from: Patient
  to: Device
  cardinality: many_to_many
  required_properties: []
- type: KNOWN_MEDICATION
  from: Patient
  to: Medication
  cardinality: many_to_many
  required_properties: []
- type: COVERED_BY
  from: Patient
  to: Payer
  cardinality: many_to_many
  required_properties: []