# Healthcare domain overlay.
# Usage: docker compose -f docker-compose.infra.yml -f docker-compose.healthcare.yml up -d

services:
  kafka-init:
    image: confluentinc/cp-kafka:7.9.0
    container_name: healthcare-kafka-init
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Waiting for Kafka cluster...'
      sleep 30
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic healthcare.ehr.events --partitions 3 --replication-factor 3
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic healthcare.lab.results --partitions 3 --replication-factor 3
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic healthcare.device.telemetry --partitions 3 --replication-factor 3
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic healthcare.pharmacy.orders --partitions 3 --replication-factor 3
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic healthcare.claims.events --partitions 3 --replication-factor 3
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic healthcare.master.patients --partitions 1 --replication-factor 3
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic healthcare.master.providers --partitions 1 --replication-factor 3
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic healthcare.master.devices --partitions 1 --replication-factor 3
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic healthcare.master.medications --partitions 1 --replication-factor 3
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic healthcare.master.payers --partitions 1 --replication-factor 3
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic healthcare.dlq.events --partitions 1 --replication-factor 3
      echo 'Healthcare Kafka topics created.'
      "

  qdrant:
    image: qdrant/qdrant:latest
    container_name: healthcare-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  neo4j:
    image: neo4j:5.26.2
    container_name: healthcare-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-healthcare123}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - ./domains/healthcare/neo4j/init.cypher:/var/lib/neo4j/import/init.cypher

  neo4j-init:
    image: neo4j:5.26.2
    container_name: healthcare-neo4j-init
    depends_on:
      - neo4j
    entrypoint: ["/bin/sh", "-c"]
    command: /bin/sh /bootstrap.sh
    volumes:
      - ./domains/healthcare/neo4j/init.cypher:/init.cypher
      - ./domains/healthcare/neo4j/generated_ontology_seeds.cypher:/generated_ontology_seeds.cypher
      - ./domains/healthcare/neo4j/bootstrap.sh:/bootstrap.sh

  neodash:
    image: neo4jlabs/neodash:latest
    container_name: healthcare-neodash
    platform: linux/amd64
    depends_on:
      - neo4j
    ports:
      - "5005:5005"
    environment:
      standalone: "true"
      standaloneProtocol: neo4j
      standaloneHost: localhost
      standalonePort: "7687"
      standaloneDatabase: neo4j
      standaloneUsername: ${NEO4J_USER:-neo4j}
      standalonePassword: ${NEO4J_PASSWORD:-healthcare123}
      standalonePasswordWarningHidden: "true"
      customHeader: Healthcare Neo4j GUI

  flink-jobmanager:
    build:
      context: .
      dockerfile: domains/healthcare/flink-app/Dockerfile
    container_name: healthcare-flink-jobmanager
    ports:
      - "8082:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 2
        state.backend: hashmap
        execution.checkpointing.interval: 10000
        execution.checkpointing.mode: EXACTLY_ONCE
        python.executable: /usr/bin/python3

  flink-taskmanager:
    build:
      context: .
      dockerfile: domains/healthcare/flink-app/Dockerfile
    container_name: healthcare-flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
        python.executable: /usr/bin/python3

  producer:
    build:
      context: .
      dockerfile: domains/healthcare/producer/Dockerfile
    container_name: healthcare-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    env_file:
      - path: ./.env
        required: false
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092,kafka2:29093,kafka3:29094
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      EVENT_INTERVAL_SECONDS: 1

  flink-app:
    build:
      context: .
      dockerfile: domains/healthcare/flink-app/Dockerfile
    container_name: healthcare-flink-app
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
      neo4j-init:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    env_file:
      - path: ./.env
        required: false
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092,kafka2:29093,kafka3:29094
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: healthcare_events
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-healthcare123}
      FLINK_KAFKA_GROUP_ID: healthcare-graphrag-pyflink
      FLINK_JOB_PARALLELISM: 1
      FLINK_CHECKPOINT_INTERVAL_MS: 10000
    command: >
      bash -c "sleep 35 && flink run -m flink-jobmanager:8081 -d -Dpython.client.executable=/usr/bin/python3 -Dpython.executable=/usr/bin/python3 -py /app/healthcare_graph_rag_pyflink_job.py && tail -f /dev/null"

  rag-api:
    build:
      context: .
      dockerfile: domains/healthcare/rag-api/Dockerfile
    container_name: healthcare-rag-api
    depends_on:
      - qdrant
      - neo4j
    ports:
      - "8000:8000"
    env_file:
      - path: ./.env
        required: false
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-healthcare_events}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-healthcare123}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      MCP_SERVER_NAME: HealthcareGraphRAG MCP

  provider-web:
    build:
      context: .
      dockerfile: domains/healthcare/webapp/Dockerfile
    container_name: healthcare-webapp
    depends_on:
      - rag-api
    ports:
      - "8088:80"

volumes:
  qdrant_storage:
  neo4j_data:

networks:
  default:
    name: graphrag-net
    external: true
