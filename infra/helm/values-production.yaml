# Production environment: multi-replica, HPA, external services, NetworkPolicy
networkPolicies:
  enabled: true
agent-service:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
  config:
    QDRANT_URL: "https://qdrant.company.example"
    QDRANT_COLLECTION: "healthcare_events"
    NEO4J_URI: "neo4j+s://neo4j.company.example:7687"
    NEO4J_USER: "neo4j"
    LLM_PROVIDER: "bedrock"
    LLM_MODEL: "anthropic.claude-3-5-haiku-20241022-v1:0"
    EMBEDDING_PROVIDER: "databricks"
    EMBEDDING_MODEL: ""
    EMBEDDING_DIM: "1024"
    DATABRICKS_EMBEDDING_ENDPOINT: "databricks-gte-large-en"
    EMBEDDING_REQUIRE_MODEL: "true"
    LLM_MODEL_SIMPLE: "bedrock:anthropic.claude-3-5-haiku-20241022-v1:0"
    LLM_MODEL_MODERATE: "bedrock:amazon.nova-pro-v1:0"
    LLM_MODEL_COMPLEX: "bedrock:anthropic.claude-3-5-sonnet-20240620-v1:0"
    LLM_FALLBACK_PROVIDER: "anthropic"
    LLM_FALLBACK_MODEL: "claude-sonnet-4-20250514"
    AWS_REGION: "us-east-1"
    DATABRICKS_HOST: "https://<workspace>.cloud.databricks.com"
    LLM_TIMEOUT_SECONDS: "120"
    LLM_MAX_TOKENS: "1200"
    OLLAMA_URL: ""
    MCP_SERVER_NAME: "HealthcareGraphRAG MCP"
    LANGGRAPH_MAX_ITERATIONS: "3"
    MLFLOW_TRACKING_URI: "http://mlflow:5000"
    MLFLOW_EXPERIMENT_NAME: "healthcare-graphrag"
    AGENT_ALLOW_ROLE_HEADER: "false"
    PATIENT_SCOPE_AUTH_REQUIRED: "true"
  secrets:
    # Inject through an external Secret; do not put credential values in this file.
    PATIENT_SCOPE_ENTITLEMENTS: ""
provider-web:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
flink:
  taskmanager:
    replicas: 2
  config:
    EMBEDDING_PROVIDER: "databricks"
    EMBEDDING_MODEL: ""
    EMBEDDING_DIM: "1024"
    DATABRICKS_HOST: "https://<workspace>.cloud.databricks.com"
    DATABRICKS_EMBEDDING_ENDPOINT: "databricks-gte-large-en"
    EMBEDDING_REQUIRE_MODEL: "true"
  secretEnv:
    DATABRICKS_TOKEN:
      name: databricks-credentials
      key: token
mlflow:
  persistence:
    enabled: true
    size: 10Gi