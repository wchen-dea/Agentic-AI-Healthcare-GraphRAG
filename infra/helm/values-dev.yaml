# Dev environment: single replica, Databricks foundation model, no HPA, NodePort access
networkPolicies:
  enabled: false
agent-service:
  replicaCount: 1
  autoscaling:
    enabled: false
  service:
    type: NodePort
    nodePort: 30800
  config:
    QDRANT_URL: "http://qdrant:6333"
    QDRANT_COLLECTION: "healthcare_events"
    NEO4J_URI: "bolt://neo4j:7687"
    NEO4J_USER: "neo4j"
    KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
    SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
    LLM_PROVIDER: "databricks"
    LLM_MODEL: "databricks-gpt-5-6-luna"
    EMBEDDING_PROVIDER: "local"
    EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
    EMBEDDING_DIM: "384"
    EMBEDDING_REQUIRE_MODEL: "true"
    LLM_TIMEOUT_SECONDS: "300"
    LLM_MAX_TOKENS: "4096"
    DATABRICKS_HOST: "https://dbc-baff2b7f-4402.cloud.databricks.com"
    OLLAMA_URL: ""
    MCP_SERVER_NAME: "HealthcareGraphRAG MCP (dev)"
    LANGGRAPH_MAX_ITERATIONS: "3"
    MLFLOW_TRACKING_URI: "http://mlflow:5000"
    MLFLOW_EXPERIMENT_NAME: "healthcare-graphrag-dev"
    AGENT_ALLOW_ROLE_HEADER: "true"
    # Minikube-only synthetic identity-to-patient entitlement guard.
    DEV_PATIENT_AUTH_ENABLED: "true"
    DEV_PATIENT_ENTITLEMENTS: "dev-clinician=patient-0001,patient-0002,patient-0003,patient-0004,patient-0050,patient-0082"
    HITL_ENABLED: "true"
    HITL_MAX_PENDING: "1000"
    LANGGRAPH_CHECKPOINT_POSTGRES_URI: "postgresql://patient_memory:change_me@patient-memory-postgres:5432/patient_memory"
    LANGGRAPH_CHECKPOINT_REQUIRED: "true"
    PATIENT_MEMORY_STORE_BACKEND: "postgres"
    PATIENT_MEMORY_DATABASE_URL: "postgresql://patient_memory:change_me@patient-memory-postgres:5432/patient_memory"
  secrets:
    NEO4J_PASSWORD: "healthcare123"
    DATABRICKS_TOKEN: "change_me"
provider-web:
  replicaCount: 1
  autoscaling:
    enabled: false
flink:
  taskmanager:
    replicas: 1
  config:
    EMBEDDING_PROVIDER: "local"
    EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
    EMBEDDING_DIM: "384"
    EMBEDDING_REQUIRE_MODEL: "true"
mlflow:
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1536Mi
kafka:
  enabled: true
neo4j:
  enabled: true
  auth:
    password: "healthcare123"
qdrant:
  enabled: true
ollama:
  enabled: false
conduktor:
  enabled: true
  service:
    type: NodePort
    port: 8080
    nodePort: 30880
producer:
  enabled: true