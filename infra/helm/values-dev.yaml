# Dev environment: single replica, Databricks foundation model, no HPA, NodePort access
networkPolicies:
  enabled: true
agent-service:
  replicaCount: 1
  autoscaling:
    enabled: false
  service:
    type: NodePort
    nodePort: 30800
  config:
    QDRANT_URL: "http://qdrant:6333"
    QDRANT_COLLECTION: "healthcare_events"
    NEO4J_URI: "bolt://neo4j:7687"
    NEO4J_USER: "neo4j"
    KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
    SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
    LLM_PROVIDER: "ollama"
    LLM_MODEL: "llama3.1"
    EMBEDDING_PROVIDER: "local"
    EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
    EMBEDDING_DIM: "384"
    EMBEDDING_REQUIRE_MODEL: "true"
    LLM_TIMEOUT_SECONDS: "300"
    LLM_MAX_TOKENS: "4096"
    DATABRICKS_HOST: "https://dbc-baff2b7f-4402.cloud.databricks.com"
    OLLAMA_URL: "http://ollama:11434"
    MCP_SERVER_NAME: "HealthcareGraphRAG MCP (dev)"
    LANGGRAPH_MAX_ITERATIONS: "3"
    MLFLOW_TRACKING_URI: "http://mlflow:5000"
    MLFLOW_EXPERIMENT_NAME: "healthcare-graphrag-dev"
    AGENT_ALLOW_ROLE_HEADER: "true"
    AUDIT_FAIL_CLOSED: "true"
    MCP_AUTH_REQUIRED: "true"
    # Minikube-only synthetic identity-to-patient entitlement guard.
    DEV_PATIENT_AUTH_ENABLED: "true"
    # Dev-only test identity: '*' grants access to all synthetic patients.
    DEV_PATIENT_ENTITLEMENTS: "dev-clinician=*"
    HITL_ENABLED: "true"
    HITL_MAX_PENDING: "1000"
    LANGGRAPH_CHECKPOINT_POSTGRES_URI: ""
    LANGGRAPH_CHECKPOINT_REQUIRED: "true"
    PATIENT_MEMORY_STORE_BACKEND: "postgres"
    PATIENT_MEMORY_DATABASE_URL: ""
  secrets:
    # Supply these through the gitignored values-dev.local.yaml or a Secret.
    NEO4J_PASSWORD: ""
    DATABRICKS_TOKEN: ""
    MCP_AUTH_TOKEN: ""
  # The local overlay must also set config database URLs and the Postgres password.
patientMemoryPostgres:
  password: ""
provider-web:
  replicaCount: 1
  autoscaling:
    enabled: false
flink:
  taskmanager:
    replicas: 1
  config:
    EMBEDDING_PROVIDER: "local"
    EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
    EMBEDDING_DIM: "384"
    EMBEDDING_REQUIRE_MODEL: "true"
    QDRANT_OUTBOX_PATH: "/tmp/qdrant-outbox.sqlite3"

mlflow:
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1536Mi
kafka:
  enabled: true
neo4j:
  enabled: true
  auth:
    password: ""
qdrant:
  enabled: true
ollama:
  enabled: true
conduktor:
  enabled: true
  service:
    type: NodePort
    port: 8080
    nodePort: 30880
producer:
  enabled: true