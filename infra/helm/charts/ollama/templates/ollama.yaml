apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- with .Values.models }}
        # Start the server, then pull each configured model so the agent never
        # meets an empty model store. Pulls are skipped when already present.
        # The readiness probe below keeps the pod un-Ready until every model exists.
        command: ["/bin/sh", "-c"]
        args:
        - |
          ollama serve &
          server_pid=$!
          waited=0
          until ollama list >/dev/null 2>&1; do
            waited=$((waited + 1))
            if [ "$waited" -ge 120 ]; then
              echo "ollama: server did not start within 120s" >&2
              exit 1
            fi
            sleep 1
          done
          for model in {{ range . }}{{ . | quote }} {{ end }}; do
            ollama pull "$model" || echo "ollama: failed to pull $model; pod stays un-Ready" >&2
          done
          wait "$server_pid"
        {{- end }}
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |
              ollama list >/dev/null{{ range .Values.models }} && ollama show {{ . | quote }} >/dev/null{{ end }}
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        ports:
        - containerPort: 11434
          name: http
        volumeMounts:
        - name: models
          mountPath: /root/.ollama
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      volumes:
      - name: models
        {{- if .Values.persistence.enabled }}
        persistentVolumeClaim:
          claimName: ollama-models
        {{- else }}
        emptyDir: {}
        {{- end }}
{{- if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  labels:
    app: ollama
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  labels:
    app: ollama
spec:
  type: {{ .Values.service.type }}
  selector:
    app: ollama
  ports:
  - name: http
    port: 11434
    targetPort: http
