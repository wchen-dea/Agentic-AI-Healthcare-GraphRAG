enabled: true
image:
  repository: ghcr.io/wchen-dea/agentic-ai-healthcare-graphrag-flink-healthcare
  tag: latest
  pullPolicy: IfNotPresent
jobmanager:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
taskmanager:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
job:
  image:
    repository: ghcr.io/wchen-dea/agentic-ai-healthcare-graphrag-flink-healthcare
    tag: latest
  mainClass: healthcare_graph_rag_pyflink_job.py
config:
  KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
  SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "healthcare123"
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_COLLECTION: "healthcare_events"