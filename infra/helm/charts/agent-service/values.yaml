enabled: true
replicaCount: 2
image:
  repository: ghcr.io/wchen-dea/agentic-ai-healthcare-graphrag-agent-service
  tag: latest
  pullPolicy: IfNotPresent
# The image runs as the non-root `app` user (uid/gid 10001); see ADR-0011.
# readOnlyRootFilesystem stays off: the Hugging Face model cache (HF_HOME) and
# the audit log (/var/log/agent-service) are written inside the container.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
service:
  type: ClusterIP
  port: 8000
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
config:
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_COLLECTION: "healthcare_events"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  LLM_PROVIDER: "ollama"
  LLM_MODEL: "llama3.1"
  LLM_TIMEOUT_SECONDS: "180"
  LLM_MAX_TOKENS: "1200"
  OLLAMA_URL: "http://ollama:11434"
  MCP_SERVER_NAME: "HealthcareGraphRAG MCP"
  LANGGRAPH_MAX_ITERATIONS: "3"
  MLFLOW_TRACKING_URI: "http://mlflow:5000"
  MLFLOW_EXPERIMENT_NAME: "healthcare-graphrag"
  AGENT_ALLOW_ROLE_HEADER: "false"
secrets: {}
# NEO4J_PASSWORD: ""
# OPENAI_API_KEY: ""

networkPolicy:
  enabled: true