enabled: true
replicaCount: 2
image:
  repository: ghcr.io/wchen-dea/agentic-ai-healthcare-graphrag-agent-service
  tag: latest
  pullPolicy: IfNotPresent
# The image runs as the non-root `app` user (uid/gid 10001); see ADR-0011.
# Runtime state is mounted explicitly; the container root filesystem is read-only.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
service:
  type: ClusterIP
  port: 8000
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
config:
  # Ingest (Flink) and query (agent) must embed with the same provider/model.
  # Dev: local all-MiniLM-L6-v2 (384 dims). Prod overlay: EMBEDDING_PROVIDER
  # "databricks", DATABRICKS_HOST, DATABRICKS_EMBEDDING_ENDPOINT
  # "databricks-gte-large-en", EMBEDDING_DIM "1024", and DATABRICKS_TOKEN under
  # secrets. Switching requires re-ingesting the Qdrant collections.
  EMBEDDING_PROVIDER: "local"
  EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
  EMBEDDING_REQUIRE_MODEL: "true"
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_COLLECTION: "healthcare_events"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  # Databricks foundation model is the default; set LLM_PROVIDER/LLM_MODEL
  # (and OLLAMA_URL for ollama) to use another provider. DATABRICKS_HOST and
  # DATABRICKS_TOKEN come from env/secrets.
  LLM_PROVIDER: "databricks"
  LLM_MODEL: "databricks-gpt-5-6-luna"
  LLM_TIMEOUT_SECONDS: "180"
  LLM_MAX_TOKENS: "1200"
  OLLAMA_URL: "http://ollama:11434"
  MCP_SERVER_NAME: "HealthcareGraphRAG MCP"
  LANGGRAPH_MAX_ITERATIONS: "3"
  MLFLOW_TRACKING_URI: "http://mlflow:5000"
  MLFLOW_EXPERIMENT_NAME: "healthcare-graphrag"
  AGENT_ALLOW_ROLE_HEADER: "false"
  PATIENT_MEMORY_STORE_BACKEND: "postgres"
  PATIENT_MEMORY_DATABASE_URL: ""
secrets: {}
patientMemoryPostgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  database: patient_memory
  user: patient_memory
  password: ""
  storage:
    size: 1Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# NEO4J_PASSWORD: ""
# OPENAI_API_KEY: ""
# DATABRICKS_TOKEN: ""

networkPolicy:
  enabled: true