apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  labels:
    {{- include "agent-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agent-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-service.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: agent-service
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        {{- end }}
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: agent-service-config
        {{- if .Values.secrets }}
        - secretRef:
            name: agent-service-secrets
        {{- end }}
        volumeMounts:
        - name: audit-log
          mountPath: /var/log/agent-service
        - name: model-cache
          mountPath: /home/app/.cache
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      volumes:
      - name: audit-log
        emptyDir: {}
      - name: model-cache
        emptyDir: {}
      - name: tmp
        emptyDir: {}
