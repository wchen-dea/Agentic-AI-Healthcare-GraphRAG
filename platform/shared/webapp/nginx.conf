server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # No Cache-Control was set previously, so browsers could keep serving a stale
  # index.html/JS/CSS after a rebuild until a hard refresh. Force revalidation.
  add_header Cache-Control "no-cache" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
