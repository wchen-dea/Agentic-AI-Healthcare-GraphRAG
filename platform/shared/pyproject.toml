[project]
name = "graphrag-shared"
version = "0.1.0"
description = "Shared platform library (embedding registry, ontology loader, rules engine) imported as `shared`"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0.2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The directory itself is the `shared` package (Flink images COPY it as-is), so
# the wheel remaps the project root to `shared/` instead of using a src layout.
# Editable installs cannot express that remap; workspace consumers install it
# non-editable and uv rebuilds it when these files change (cache-keys).
[tool.hatch.build.targets.wheel]
only-include = [
    "__init__.py",
    "embedding.py",
    "ontology_loader.py",
    "rules_engine.py",
    "runner.py",
    "storage.py",
    "ontology",
]

[tool.hatch.build.targets.wheel.sources]
"" = "shared"

[tool.hatch.build.targets.sdist]
exclude = ["webapp", "__pycache__"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "*.py" }, { file = "ontology/*.yaml" }]
